[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chronogrn"
version = "0.2.0"
description = "ChronoGRN: delay-aware, enhancer-gated, time-varying gene regulatory network inference from multiome trajectories"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "torch>=2.1",
  "matplotlib>=3.7",
  "networkx>=3.0",
]

[project.optional-dependencies]
notebook = ["jupyter>=1.0"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
